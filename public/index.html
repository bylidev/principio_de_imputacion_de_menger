<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Informe de Gestión: Registro de Causas LLA</title>
    <style>
        :root {
            --lla-violet: #5a2d82;
            --lla-gold: #ffcc00;
            --bg-dark: #0d0d0d;
            --text-main: #2b0a42;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: radial-gradient(circle at top, #1a0b2e 0%, #0d0d0d 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 0;
            overflow: hidden;
            color: white;
            width: 100%;
        }
        #canvas-container {
            position: relative;
            width: 100%;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding-top: 0;
            overflow: hidden;
        }
        canvas {
            background-color: #ffffff;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            cursor: grab;
            max-width: 100%;
        }
        canvas:active {
            cursor: grabbing;
        }
    </style>
</head>
<body>

    <div id="canvas-container">
        <canvas id="informeCanvas"></canvas>
    </div>

    <script>
        const canvas = document.getElementById('informeCanvas');
        const ctx = canvas.getContext('2d', { alpha: false });

        const docWidth = 800;
        const docHeight = 1950; // Ajustado por la eliminación de un item
        
        const dpr = window.devicePixelRatio || 1;
        
        function resize() {
            const containerWidth = window.innerWidth;
            const containerHeight = window.innerHeight;
            
            canvas.style.width = Math.min(containerWidth, docWidth) + 'px';
            canvas.style.height = containerHeight + 'px';
            
            canvas.width = Math.min(containerWidth, docWidth) * dpr;
            canvas.height = containerHeight * dpr;
            
            ctx.setTransform(1, 0, 0, 1, 0, 0);
            ctx.scale(dpr * (Math.min(containerWidth, docWidth) / docWidth), dpr);
            draw();
        }

        let scrollY = 0;
        const maxScroll = docHeight - window.innerHeight;

        const LLA_VIOLET = "#5a2d82";
        const LLA_GOLD = "#ffcc00";

        const causas = [
            {
                titulo: "DESFALCO Y CRISIS EN EL IOSFA",
                involucrados: "Luis Petri (Min. Defensa), Darío Messina (IOSFA).",
                detalle: "Denuncias por vaciamiento de la obra social militar. Deuda de $30.000M, interrupción de tratamientos oncológicos y falta de insumos médicos básicos.",
                estado: "EMERGENCIA MÉDICA",
                color: LLA_VIOLET
            },
            {
                titulo: "CONTRATACIONES Y ASCENSOS FAMILIARES",
                involucrados: "Manuel Adorni, Francisco Adorni, Luis Petri.",
                detalle: "Nombramiento de Francisco Adorni en Defensa con sueldo millonario. Ascensos de rango ministerial para el vocero con incrementos salariales discrecionales.",
                estado: "DENUNCIA ÉTICA",
                color: LLA_VIOLET
            },
            {
                titulo: "TRASLADO DE RESERVAS DE ORO",
                involucrados: "Santiago Bausili (BCRA), Luis Caputo (Min. Economía).",
                detalle: "Envío físico de reservas de oro a Londres sin transparencia legislativa. Riesgo de embargo por litigios internacionales y falta de registro administrativo.",
                estado: "DENUNCIA PENAL",
                color: LLA_VIOLET
            },
            {
                titulo: "IRREGULARIDADES EN ANSES Y SEGUROS",
                involucrados: "Mariano de los Heros, Sandra Pettovello.",
                detalle: "Investigación sobre la continuidad de esquemas de seguros con intermediarios y despidos masivos que paralizaron la atención en UDAI de todo el país.",
                estado: "CRISIS OPERATIVA",
                color: LLA_VIOLET
            },
            {
                titulo: "FONDOS RESERVADOS SIDE",
                involucrados: "Santiago Caputo (Asesor), Sergio Neiffert.",
                detalle: "Asignación por DNU de $100.000 millones para inteligencia. Ejecución del 80% del presupuesto en semanas sin auditoría previa al rechazo del Congreso.",
                estado: "INVESTIGACIÓN EJECUCIÓN",
                color: "#dc2626"
            },
            {
                titulo: "VIAJES CON FONDOS DEL ESTADO",
                involucrados: "Karina Milei, Javier Milei.",
                detalle: "Uso sistemático de la flota presidencial para traslados con fines de agenda personal, religiosa o partidaria en el exterior sin carácter institucional.",
                estado: "BAJO LUPA FISCAL",
                color: LLA_VIOLET
            },
            {
                titulo: "PATRIMONIO Y PROPIEDADES DE ADORNI",
                involucrados: "Manuel Adorni (Vocero Presidencial).",
                detalle: "Inconsistencias patrimoniales relacionadas a la adquisición de departamentos y bienes de lujo. Denuncias sobre subsidios previos incompatibles con su rol.",
                estado: "INVESTIGACIÓN PATRIMONIAL",
                color: LLA_VIOLET
            }
        ];

        function wrapText(context, text, x, y, maxWidth, lineHeight) {
            let words = text.split(' ');
            let line = '';
            for(let n = 0; n < words.length; n++) {
                let testLine = line + words[n] + ' ';
                if (context.measureText(testLine).width > maxWidth && n > 0) {
                    context.fillText(line, x, y);
                    line = words[n] + ' ';
                    y += lineHeight;
                } else { line = testLine; }
            }
            context.fillText(line, x, y);
            return y;
        }

        function draw() {
            ctx.clearRect(0, 0, docWidth, docHeight);
            ctx.save();
            ctx.translate(0, -scrollY);

            // Background
            ctx.fillStyle = "#f8fafc";
            ctx.fillRect(0, 0, docWidth, docHeight);

            // Header
            const headerGrad = ctx.createLinearGradient(0, 0, 0, 180);
            headerGrad.addColorStop(0, "#2b0a42");
            headerGrad.addColorStop(1, LLA_VIOLET);
            ctx.fillStyle = headerGrad;
            ctx.fillRect(0, 0, docWidth, 180);
            
            // Header Text Centered
            ctx.fillStyle = LLA_GOLD;
            ctx.font = "900 36px -apple-system, sans-serif";
            ctx.textAlign = "center";
            ctx.letterSpacing = "1px";
            ctx.fillText("LA LIBERTAD AVANZA", docWidth / 2, 85);
            
            ctx.fillStyle = "rgba(255,255,255,0.9)";
            ctx.font = "500 15px -apple-system, sans-serif";
            ctx.fillText("INFORME DE AUDITORÍA Y REGISTRO DE CAUSAS JUDICIALES", docWidth / 2, 115);

            let currentY = 220;
            const margin = 45;

            causas.forEach((c) => {
                const boxHeight = 185;
                const cardW = docWidth - (margin * 2);

                ctx.save();
                ctx.shadowColor = "rgba(0,0,0,0.06)";
                ctx.shadowBlur = 20;
                ctx.shadowOffsetY = 10;
                ctx.fillStyle = "#ffffff";
                ctx.beginPath();
                ctx.roundRect(margin, currentY, cardW, boxHeight, 16);
                ctx.fill();
                ctx.restore();

                ctx.fillStyle = LLA_VIOLET;
                ctx.beginPath();
                ctx.roundRect(margin, currentY, 8, boxHeight, {tl: 16, bl: 16});
                ctx.fill();

                ctx.textAlign = "left";
                ctx.fillStyle = "#1e1b4b";
                ctx.font = "bold 18px -apple-system, sans-serif";
                ctx.fillText(c.titulo, margin + 35, currentY + 45);

                ctx.fillStyle = "#6366f1";
                ctx.font = "bold 12px -apple-system, sans-serif";
                ctx.fillText("INVOLUCRADOS: " + c.involucrados.toUpperCase(), margin + 35, currentY + 70);

                ctx.fillStyle = "#475569";
                ctx.font = "400 15px -apple-system, sans-serif";
                wrapText(ctx, c.detalle, margin + 35, currentY + 100, cardW - 70, 22);

                ctx.font = "bold 11px -apple-system, sans-serif";
                const tw = ctx.measureText(c.estado).width;
                ctx.fillStyle = c.color;
                ctx.beginPath();
                ctx.roundRect(margin + 35, currentY + boxHeight - 38, tw + 20, 24, 12);
                ctx.fill();

                ctx.fillStyle = "#ffffff";
                ctx.fillText(c.estado, margin + 45, currentY + boxHeight - 22);

                currentY += boxHeight + 35;
            });

            ctx.restore();
        }

        let isDragging = false;
        let lastY = 0;

        const performScroll = (delta) => {
            scrollY = Math.max(0, Math.min(scrollY + delta, maxScroll));
            requestAnimationFrame(draw);
        };

        window.addEventListener('wheel', (e) => performScroll(e.deltaY), { passive: true });
        canvas.addEventListener('mousedown', (e) => { isDragging = true; lastY = e.clientY; });
        window.addEventListener('mousemove', (e) => {
            if (isDragging) {
                performScroll((lastY - e.clientY) * 1.5);
                lastY = e.clientY;
            }
        });
        window.addEventListener('mouseup', () => isDragging = false);

        canvas.addEventListener('touchstart', (e) => { isDragging = true; lastY = e.touches[0].clientY; }, { passive: true });
        canvas.addEventListener('touchmove', (e) => {
            if (isDragging) {
                performScroll((lastY - e.touches[0].clientY) * 1.5);
                lastY = e.touches[0].clientY;
            }
        }, { passive: false });
        canvas.addEventListener('touchend', () => isDragging = false);

        window.onload = resize;
        window.onresize = resize;
    </script>
</body>
</html>
